apis:
- name: SpacetimeDB HTTP API
  description: >-
    The SpacetimeDB HTTP API lets clients and tools interact with SpacetimeDB databases: publish
    and delete database modules, manage database names, retrieve schema and logs, invoke reducers,
    run SQL queries, open real-time subscription WebSockets, and create/verify Spacetime identities
    and JWT tokens. Authentication is a Bearer JWT (SpacetimeAuth/OIDC, or an anonymously generated
    identity token). Base host is the hosted SpacetimeDB Cloud (Maincloud); the same API is served
    by any self-hosted `spacetime start` instance.
  humanURL: https://spacetimedb.com/docs/http/database/
  baseURL: https://maincloud.spacetimedb.com
