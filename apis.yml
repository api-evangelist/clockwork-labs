aid: clockwork-labs
name: Clockwork Labs
description: >-
  Clockwork Labs is a San Francisco software company (founded 2019) that builds SpacetimeDB, a
  relational database that is also an application server: developers upload their schema and
  server-side business logic as a WebAssembly "module" (written in Rust, C#, TypeScript, or C++)
  directly into the database, and clients connect over WebSocket to invoke reducers and subscribe
  to real-time state updates with no separate application server in between. SpacetimeDB exposes a
  versioned HTTP API (/v1/database and /v1/identity) for publishing modules, invoking reducers,
  running SQL, streaming subscriptions, and managing identities and JWT tokens, plus a first-party
  `spacetime` CLI and client SDKs for TypeScript, C#/Unity, Rust, Python, and C++. It is the
  production backend of BitCraft, the company's MMO. Clockwork Labs is backed by a16z, Supercell,
  Firstminute Capital, Skycatcher, 1Up Ventures, and Supernode.
